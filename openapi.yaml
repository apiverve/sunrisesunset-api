openapi: 3.0.4
info:
  title: Sunrise Sunset
  description: >-
    Sunrise Sunset calculates exact sunrise and sunset times, twilight stages,
    and golden hour windows for any latitude and longitude coordinates. Paid
    plans can specify custom dates and receive solar noon. With local=true, the
    response names the IANA timezone of the coordinates on any plan, and paid
    plans also get each time in local time with its UTC offset.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/sunrisesunset:
    get:
      summary: Sunrise Sunset
      description: >-
        Get the sunrise and sunset times for a given location, optionally in
        local time
      operationId: sunrisesunset
      parameters:
        - name: lat
          in: query
          schema:
            type: number
          required: true
          description: The latitude of the location
          example: 36.72016
        - name: lon
          in: query
          schema:
            type: number
          required: true
          description: The longitude of the location
          example: -4.42034
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            The date for which you want to get the sunrise and sunset times
            (e.g., MM-DD-YYYY : 01-01-2022)
          example: 01-16-2026
        - name: local
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Also return the timezone of the coordinates and every time in local
            time
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  solarNoon: '2026-01-16T12:28:27.256Z'
                  sunrise: '2026-01-16T07:30:14.174Z'
                  sunset: '2026-01-16T17:26:40.338Z'
                  sunriseEnd: '2026-01-16T07:33:11.786Z'
                  sunsetStart: '2026-01-16T17:23:42.726Z'
                  dawn: '2026-01-16T07:02:03.459Z'
                  dusk: '2026-01-16T17:54:51.053Z'
                  nauticalDawn: '2026-01-16T06:30:17.010Z'
                  nauticalDusk: '2026-01-16T18:26:37.502Z'
                  nightEnd: '2026-01-16T05:59:14.883Z'
                  night: '2026-01-16T18:57:39.629Z'
                  goldenHourEnd: '2026-01-16T08:09:09.341Z'
                  goldenHour: '2026-01-16T16:47:45.171Z'
                  timezone: Europe/Madrid
                  localTimes:
                    solarNoon: '2026-01-16T13:28:27+01:00'
                    sunrise: '2026-01-16T08:30:14+01:00'
                    sunset: '2026-01-16T18:26:40+01:00'
                    sunriseEnd: '2026-01-16T08:33:11+01:00'
                    sunsetStart: '2026-01-16T18:23:42+01:00'
                    dawn: '2026-01-16T08:02:03+01:00'
                    dusk: '2026-01-16T18:54:51+01:00'
                    nauticalDawn: '2026-01-16T07:30:17+01:00'
                    nauticalDusk: '2026-01-16T19:26:37+01:00'
                    nightEnd: '2026-01-16T06:59:14+01:00'
                    night: '2026-01-16T19:57:39+01:00'
                    goldenHourEnd: '2026-01-16T09:09:09+01:00'
                    goldenHour: '2026-01-16T17:47:45+01:00'
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
